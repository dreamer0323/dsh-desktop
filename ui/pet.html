<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Marisa Pet</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div class="stage">

    <!-- 顶部状态条：token 用量 -->
    <div id="statusBar" class="status-bar" hidden>
      <span id="tokenPill" class="token-pill" title="本次会话消耗的 token 数">tokens --</span>
    </div>

    <!-- 静态 fumo 形象（单帧，无动画，可拖拽） -->
    <div id="mascot" class="mascot" title="按住拖动">
      <img id="fumo" class="fumo" src="../assets/pet/marisa-fumo.png"
           alt="Marisa Fumo" draggable="false" />
      <div class="pills">
        <span id="statsPill" class="pill">内存 -- · CPU --</span>
        <span id="tokenMini" class="pill pill--gold" hidden>tokens --</span>
      </div>
    </div>

    <!-- 语音气泡 -->
    <div id="bubble" class="bubble" hidden>
      <span id="bubbleText"></span>
    </div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
